{% extends 'base/base.html' %}

{% block title %}Acceso no permitido | Atlantic City CRM{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card shadow-sm border-0">
            <div class="card-body text-center py-5">

                <h1 class="display-5 fw-bold text-danger mb-3">403</h1>

                <h2 class="h4 mb-3">Acceso no permitido</h2>

                <p class="text-muted mb-4">
                    No tienes permisos para realizar esta acción o ingresar a esta sección del sistema.
                </p>

                <a href="{% url 'inicio_dashboard' %}" class="btn btn-primary">
                    Volver al dashboard
                </a>

            </div>
        </div>

    </div>
</div>

{% endblock %}
